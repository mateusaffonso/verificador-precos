name: Verificar preços

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 minutos (o GitHub pode atrasar alguns minutos em horários de pico)
  workflow_dispatch:
    inputs:
      discover:
        description: 'Refazer a busca ampla em todas as lojas agora'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Preparar dados (branch data)
        run: bash scripts/prepare-data.sh

      - name: Verificar preços, cupons e promoções
        env:
          DATA_DIR: data
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          FORCE_DISCOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.discover }}
          PW_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node src/run.js

      - name: Salvar dados
        if: always()
        run: bash scripts/save-data.sh
